zones:
  contracts:
    label: "contracts"
    description: "Contract management — product contracts, service contracts, express contracts, terms, terminations"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "product-contract"
      - "service-contract"
      - "express-contract"
      - "terms"
      - "terms-group"
      - "terminations"
      - "termination-groups"
      - "test-service-contract-termination"
    sources:
      - type: swagger
        paths:
          - "Cursor-Project/config/swagger/dev"
          - "Cursor-Project/config/swagger/dev2"
          - "Cursor-Project/config/swagger/test"
          - "Cursor-Project/config/swagger/preprod"
    color: "#2196F3"

  billing:
    label: "billing"
    description: "Billing process — billing runs, billing groups, billing profiles, scales, accounting periods, IAP"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "billing-run"
      - "billing-group"
      - "billing-by-profile"
      - "billing-by-scales"
      - "accounting-period"
      - "iap"
      - "advanced-payment-group"
    sources:
      - type: swagger
    color: "#FF5722"

  invoicing:
    label: "invoicing"
    description: "Invoice management — invoices, invoice cancellation, credit notes"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "invoice"
      - "invoice-cancellation"
    sources:
      - type: swagger
    color: "#E91E63"

  payments:
    label: "payments"
    description: "Financial operations — payments, deposits, liabilities, receivables, fines, penalties, collections"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "payment"
      - "payment-package"
      - "deposit"
      - "customer-liability"
      - "customer-receivable"
      - "latePaymentFine"
      - "interest-rate"
      - "penalties"
      - "penalty-groups"
      - "manual-liability-offsetting"
      - "collection-channel"
    sources:
      - type: swagger
    color: "#4CAF50"

  customers:
    label: "customers"
    description: "Customer management — customers, assessment, unwanted customers, connected groups"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "customer"
      - "customer-assessment"
      - "customer-assessment-criteria"
      - "unwanted-customer"
      - "unwanted-customer-reason"
      - "connected-group"
      - "missing-customer"
    sources:
      - type: swagger
    color: "#9C27B0"

  products:
    label: "products"
    description: "Product catalog & pricing — products, price components, prices, discounts, compensations"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "products"
      - "price-components"
      - "price-component-groups"
      - "prices"
      - "discounts"
      - "government-compensations"
      - "nomenclature"
    sources:
      - type: swagger
    color: "#FF9800"

  service_operations:
    label: "service_operations"
    description: "Service delivery & operations — service orders, actions, processes, tasks, disconnection, reconnection, rescheduling"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "service-order"
      - "services"
      - "actions"
      - "process"
      - "process-periodicity"
      - "task"
      - "task-types"
      - "disconnection-of-power-supply"
      - "disconnection-of-power-supply-requests"
      - "reconnection-of-the-power-supply"
      - "cancellation-of-disconnection-of-the-power-supply"
      - "power-supply-disconnection-reminder"
      - "rescheduling"
      - "reminder"
      - "locks"
      - "mass-operation-for-blocking"
      - "mass-import"
    sources:
      - type: swagger
    color: "#00BCD4"

  communications:
    label: "communications"
    description: "Communication channels — email, SMS, system messages, templates, documents"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "email-communication"
      - "sms-communication"
      - "system-message"
      - "system-activities"
      - "template"
      - "documents"
      - "resource-file"
    sources:
      - type: swagger
    color: "#795548"

  reference_data:
    label: "reference_data"
    description: "Master/reference data — geography, currencies, grid operators, portal, xEnergie, balancing groups, goods"
    node_types:
      - Endpoint
      - DTO
      - EnumType
    prefixes:
      - "zip-codes"
      - "streets"
      - "districts"
      - "municipalities"
      - "regions"
      - "populated-places"
      - "residential-areas"
      - "currencies"
      - "company-details"
      - "pod"
      - "profiles"
      - "preferences"
      - "grid-operators"
      - "xEnergie"
      - "portal"
      - "portal-beta"
      - "qes"
      - "balancingGroupCoordinatorObjection"
      - "objection-withdrawal-to-change-of-a-balancing-group-coordinator"
      - "goods-order"
      - "goods"
      - "vat-rates"
      - "user-types"
      - "socket"
    sources:
      - type: swagger
    color: "#607D8B"

bridges:
  - from_zone: contracts
    to_zone: billing
    edge_type: TRIGGERS
    description: "Contract triggers billing process"

  - from_zone: billing
    to_zone: invoicing
    edge_type: GENERATES
    description: "Billing run generates invoices"

  - from_zone: invoicing
    to_zone: payments
    edge_type: CREATES_LIABILITY
    description: "Invoice creates payment liability"

  - from_zone: contracts
    to_zone: customers
    edge_type: BELONGS_TO
    description: "Contract belongs to a customer"

  - from_zone: contracts
    to_zone: products
    edge_type: USES_PRODUCT
    description: "Contract uses a product"

  - from_zone: service_operations
    to_zone: contracts
    edge_type: AFFECTS
    description: "Service operation affects contract"

  - from_zone: communications
    to_zone: customers
    edge_type: SENT_TO
    description: "Communication sent to customer"

staleness:
  check_on_query: true
  max_age_hours: 24
  hash_algorithm: "sha256"

llm:
  base_url: "http://localhost:1234/v1"
  model: "qwen2.5-3b-instruct"
  embed_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.1
  max_tokens: 2048

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "paroli123"
  database: "neo4j"
