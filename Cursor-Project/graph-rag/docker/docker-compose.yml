# Portable Graph RAG stack: Neo4j + Ollama + GraphRAG MCP (SSE)
# Usage: copy .env.example -> .env, then scripts/start.ps1 or start.sh

name: graph-rag

services:
  neo4j:
    image: neo4j:5
    container_name: graph-rag-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1;' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: graph-rag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  graph-rag:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graph-rag-mcp
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8100}:8100"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      NEO4J_BROWSER_URL: "${NEO4J_BROWSER_URL:-http://localhost:7474}"
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      LLM_EMBED_MODEL: "${LLM_EMBED_MODEL:-text-embedding-nomic-embed-text-v1.5}"
      GRAPH_RAG_WORKSPACE: /workspace
      PYTHONPATH: /app/graph-rag
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
    volumes:
      - "${GRAPH_RAG_WORKSPACE_HOST}:/workspace:ro"
      - "${GRAPH_RAG_WORKSPACE_HOST}/Cursor-Project/graph-rag:/app/graph-rag:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8100/sse | grep -Eq '200|400|405|406'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
