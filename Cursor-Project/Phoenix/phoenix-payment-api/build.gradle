tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('clearDependencyCache') {
	doLast {
		def startNames = []
		fileTree("${rootProject.gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/bg.energo").visit { details ->
			startNames << details.file.path
		}
		println("startNames ${startNames}")

		project.delete("${rootProject.gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/bg.energo/phoenix-core-lib2")
		println("${rootProject.gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/bg.energo/phoenix-core-lib2")
		def names = []
		fileTree("${rootProject.gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/bg.energo").visit { details ->
			names << details.file.path
		}
		println("names ${names}")
	}
}

tasks.named('build').configure {
	finalizedBy 'clearDependencyCache'
}

tasks.named('clean').configure {
	finalizedBy 'clearDependencyCache'
}

