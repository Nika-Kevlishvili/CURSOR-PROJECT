plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'bg.energo'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

def profile = project.hasProperty('profile') ? project.getProperty('profile') : 'dev'
def devVersion = '1.39.85-SNAPSHOT'
def testVersion = '0.0.26'

//java {
//	toolchain {
//		languageVersion = JavaLanguageVersion.of(17)
//	}
//}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext {
	liquibaseGradlePluginVersion = '2.1.1'
	postgresqlVersion = '42.5.1'
	liquibaseCore = '4.16.1'
	lombokVersion = '1.18.24'
	openApiVersion = '2.5.0'
	springCloudVersion = '2023.0.2'
	iban4jVersion = '3.2.3-RELEASE'
	coreLibVersion = (profile in ['test', 'preProd']) ? testVersion : devVersion
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.2"
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url "http://nexus.domain.internal:8081/repository/epro-maven-snapshots/"
		allowInsecureProtocol = true
	}
	maven {
		url "http://nexus.domain.internal:8081/repository/epro-maven-releases/"
		allowInsecureProtocol = true
	}
	maven {
		url "https://releases.aspose.com/java/repo/"
		allowInsecureProtocol = true
	}
}

dependencies {
	implementation group: "bg.energo", name: "phoenix-core-lib2", version: "${coreLibVersion}"
