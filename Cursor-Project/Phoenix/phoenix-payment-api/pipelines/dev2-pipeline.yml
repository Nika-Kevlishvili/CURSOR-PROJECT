stages:
  - dependencies
  - build
  - build-docker
  - deploy

variables:
  DOCKER_DRIVER: overlay
  IMAGE_NAME: git.domain.internal/asterbit/phoenix-payment-dev-api2
  CONTAINER_PORT: 9092
  APP_NAME: phoenix-payment-dev-api2
  serverUrl: http://10.236.20.11:9092
  profile: dev

build:
  # image: gradle:7.3.3-jdk17-alpine

  stage: build
  before_script:
    - sudo chown gitlab-runner:gitlab-runner /home/gitlab-runner/builds -R
  script:
    - echo "Clean the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew clean --no-daemon
    - echo "Compiling the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew build --no-daemon

  after_script:
    - sudo chown gitlab-runner:gitlab-runner /home/gitlab-runner/builds -R

  artifacts:
    paths:
      - build/libs/phoenix-payment-api-0.0.1-SNAPSHOT.jar
    expire_in: 1 week
  tags:
    #  - dev-runner-docker
    - dev-runner-shell
  needs: [ "choose_env" ]

build-docker:
  stage: build-docker
  script:
    - sudo docker build -t $IMAGE_NAME .
  tags:
    - dev-runner-shell
  needs: [ "build" ]

container-deploy:
  stage: deploy
  script:
    - sudo docker stop -t 25 $APP_NAME > /dev/null 2>&1 || true
    - sudo docker rm $APP_NAME > /dev/null 2>&1 || true
    - sudo docker run -v /data2:/data -v /phoenix/cert/:/usr/share/certs/ -v /phoenix/jsingpdf/:/usr/share/jsingpdf/ -v /usr/share/fonts:/usr/share/fonts --env serverUrl=$serverUrl --env profile=$profile -d --restart unless-stopped --name $APP_NAME -p $CONTAINER_PORT:8081 $IMAGE_NAME
    - sudo docker system prune -f
  tags:
    - dev-runner-shell
  needs: [ "build-docker" ]
