stages:
  - dependencies
  - build
  - build-docker
  - deploy

variables:
  DOCKER_DRIVER: overlay
  IMAGE_NAME: git.domain.internal/asterbit/phoenix-scheduler-prod
  CONTAINER_PORT: 8098
  APP_NAME: phoenix-scheduler-prod-app
  serverUrl: http://10.236.20.31:8098
  profile: prod

build:
  # image: gradle:7.3.3-jdk17-alpine

  stage: build
  script:
    - echo "Clean the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew clean --no-daemon
    - echo "Compiling the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew build -Pprofile=prod --no-daemon
  artifacts:
    paths:
      - build/libs/phoenix-scheduler-0.0.1-SNAPSHOT.jar
    expire_in: 1 week
  tags:
    - production_apps
  needs: [ "choose_env" ]

build-docker:
  stage: build-docker
  script:
    - sudo docker build -t $IMAGE_NAME .
  tags:
    - production_apps
  needs: [ "build" ]

container-deploy:
  stage: deploy
  script:
    - sudo docker rm -f $APP_NAME > /dev/null 2>&1
    - sudo docker run -v /phoenix/xenergy:/usr/share/xEnergie/reports -v /data:/data -v /Phxsign_140:/Phxsign_140 -v /usr/share/certs/:/usr/share/certs/ -v /phoenix/jsingpdf/:/usr/share/jsingpdf/ -v /usr/share/fonts:/usr/share/fonts --env vault_secret=$vault_secret --env serverUrl=$serverUrl --env profile=$profile -d --restart unless-stopped --name $APP_NAME $IMAGE_NAME
    - sudo docker system prune -f
  tags:
    - production_apps
  needs: [ "build-docker" ]
