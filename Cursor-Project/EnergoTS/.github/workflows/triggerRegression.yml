name: Trigger Regression Workflow

on:
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  trigger-regression:
    runs-on: [self-hosted, runner1]

    defaults:
      run:
        shell: bash

    steps:
      - name: Trigger Dev Regression Workflow
        run: |
          curl -k -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukachrk/EnergoTS/actions/workflows/dev-regression.yml/dispatches \
            -d '{"ref":"old-dev"}'

      - name: Trigger Dev2 Regression Workflow
        run: |
          curl -k -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukachrk/EnergoTS/actions/workflows/dev2-regression.yml/dispatches \
            -d '{"ref":"main"}'
      
      - name: Trigger Test Regression Workflow
        run: |
          curl -k -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukachrk/EnergoTS/actions/workflows/test-regression.yml/dispatches \
            -d '{"ref":"old-dev"}'
      
      - name: Trigger Production Workflow on preprod environment
        run: |
          curl -k -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukachrk/EnergoTS/actions/workflows/prod.yml/dispatches \
            -d '{"ref":"prod-api","inputs":{"prod_type":"preprod"}}'
      
      - name: Trigger Production Workflow on prod environment
        run: |
          curl -k -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukachrk/EnergoTS/actions/workflows/prod.yml/dispatches \
            -d '{"ref":"prod-api","inputs":{"prod_type":"prod"}}'

      - name: Notify Slack - Regression Started
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "C0ANBH2FERJ",
              "text": "Regression started on all environments:\n\n• *Dev* regression\n• *Test* regression\n• *Dev2* regression\n• *Preprod* regression\n• *Prod* regression"
            }'