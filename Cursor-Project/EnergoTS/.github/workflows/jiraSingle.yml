name: Jira Workflow

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Test name or ID (e.g. REG-95)'
        required: true
      BASE_URL:
        description: 'Override API base URL'
        required: true

jobs:
  run-tests:
    runs-on: self-hosted
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --depth=1 origin "${GITHUB_SHA}" || git fetch --force --depth=1 origin "${GITHUB_REF}"
          git checkout --force --detach "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"
          git config --global core.longPaths true
          git clean -ffdx -e node_modules -e test-results || true
          git log -1 --oneline
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
        
      - name: Notify Slack - Pipeline Started
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
          TEST_CASE: ${{ github.event.inputs.test_case }}
        run: |
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"C0ANBH2FERJ\",
              \"text\": \"Pipeline started\\n\\nEnvironment: \`$BASE_URL\`\\nWorkflow: Jira Single Test\\nTest Case: \`$TEST_CASE\`\"
            }"
        
      - name: Run global setup
        id: setup
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
        run: |
          echo "Running global setup with 1 worker..."
          npx playwright test --project=setup --workers=1

      - name: Run main tests with parallel workers
        if: steps.setup.outcome == 'success'  # Only run if setup succeeds
        continue-on-error: true
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
        run: |
          PLAYWRIGHT_BLOB_OUTPUT_NAME=main.zip npx playwright test --project=main --workers=1 --grep "\\b${{ github.event.inputs.test_case }}\\b" --grep-invert "@bigData" --reporter=blob

      - name: Run SLP tests
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
        run: |
          PWTEST_BLOB_DO_NOT_REMOVE=1 PLAYWRIGHT_BLOB_OUTPUT_NAME=additional.zip npx playwright test --project="additional billing tests" --workers=1 --reporter=blob --grep "\\b${{ github.event.inputs.test_case }}\\b" --grep-invert "@bigData"

      - name: Refresh setup for sales portal
        id: setup-sales-portal
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
        run: |
          echo "Re-running global setup to refresh the sales portal token..."
          npx playwright test --project=setup --workers=1

      - name: Run sales portal tests
        if: steps.setup-sales-portal.outcome == 'success'
        continue-on-error: true
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BASE_URL: ${{ github.event.inputs.BASE_URL }}
        run: |
          PWTEST_BLOB_DO_NOT_REMOVE=1 PLAYWRIGHT_BLOB_OUTPUT_NAME=sales-portal.zip npx playwright test --project="sales portal" --no-deps --workers=1 --reporter=blob --grep "\\b${{ github.event.inputs.test_case }}\\b" --grep-invert "@bigData"

      - name: Combine Playwright reports
        if: always()
        run: |
          if ls blob-report/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports -c playwright.config.ts ./blob-report
          else
            echo "No blob reports found; skipping merge."
          fi

      - name: Send report project (after reporters flushed)
        if: always()
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          INDIVIDUAL: 'true'
        run: npx playwright test --project="send report" --reporter=line