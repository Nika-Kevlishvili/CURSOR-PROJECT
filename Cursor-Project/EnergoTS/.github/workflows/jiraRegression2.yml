name: Jira Workflow

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: self-hosted
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Notify Slack - Pipeline Started
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "C0ANBH2FERJ",
              "text": "Pipeline started on *Dev2* environment\n\nEnvironment: `https://devapps.energo-pro.bg/backend/phoenix-dev2`\nWorkflow: Jira Regression (Dev2)"
            }'
        
      - name: Run global setup
        id: setup
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: 'https://devapps.energo-pro.bg/backend/phoenix-dev2'
        run: |
          echo "Running global setup with 1 worker..."
          npx playwright test --project=setup --workers=1

      - name: Run main tests with parallel workers
        if: steps.setup.outcome == 'success'  # Only run if setup succeeds
        continue-on-error: true
        env:
          DEVAUTHAPI: ${{ secrets.DEVAUTHAPI }}
          TESTAUTHAPI: ${{ secrets.TESTAUTHAPI }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: 'https://devapps.energo-pro.bg/backend/phoenix-dev2'
        run: |
          npx playwright test --project=main --grep-invert "@bigData" --workers=4

      - name: Send report project (after reporters flushed)
        if: always()
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          INDIVIDUAL: 'true'
        run: npx playwright test --project="send report" --reporter=line