stages:
  - dependencies
  - build

variables:
  DOCKER_DRIVER: overlay
  IMAGE_NAME: git.domain.internal/asterbit/phoenix-payment-dev-api
  CONTAINER_PORT: 9090
  APP_NAME: phoenix-payment-dev-api
  profile: dev

build:
  stage: build
  script:
    - echo "Clean the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew clean --no-daemon
    - echo "Compiling the code..."
    - sudo sh $CI_PROJECT_DIR/gradlew build --no-daemon
  after_script:
    - sudo chown gitlab-runner:gitlab-runner /home/gitlab-runner/builds -R
  artifacts:
    paths:
      - build/libs/phoenix-payment-api-0.0.1-SNAPSHOT.jar
    expire_in: 1 week
  tags:
    - dev-runner-shell
  needs: [ "choose_env" ]
