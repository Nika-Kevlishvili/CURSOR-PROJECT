# Engine checks on every pull request and on every push to main (ADR-0005).
# A red check means: do not merge until it is green.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code (full history, for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Structure check
        run: python3 sdlc/checks/check_structure.py

      - name: Hook drill (every hook must be ARMED)
        run: python3 sdlc/checks/drill_hooks.py

      - name: Drill the drill (do-nothing hooks must be reported DEAD)
        run: |
          set +e
          ASTERBIT_DRILL_STUB=1 python3 sdlc/checks/drill_hooks.py
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "The drill cannot tell a working hook from a dead one (stub mode exit $code, expected 1)."
            exit 1
          fi
          echo "OK: stub mode was reported DEAD, so the drill can fail."

      - name: Secret scan (whole history)
        run: gitleaks git --redact --no-banner .
